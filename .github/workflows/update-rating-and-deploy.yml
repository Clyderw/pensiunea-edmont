name: Update Booking rating and deploy

on:
  push:
    branches:
      - source
    paths-ignore:
      - public/booking-rating.json
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edmont-pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: source
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh Booking score
        env:
          BOOKING_API_TOKEN: ${{ secrets.BOOKING_API_TOKEN }}
          BOOKING_AFFILIATE_ID: ${{ secrets.BOOKING_AFFILIATE_ID }}
          BOOKING_ACCOMMODATION_ID: ${{ secrets.BOOKING_ACCOMMODATION_ID }}
        run: node scripts/update-booking-rating.mjs

      - name: Save a changed score
        run: |
          if git diff --quiet -- public/booking-rating.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/booking-rating.json
          git commit -m "Update Booking rating"
          git push origin HEAD:source

      - name: Build GitHub Pages
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /pensiunea-edmont
        run: npm exec -- next build

      - name: Publish gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch out/.nojekyll
          cd out
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy EdMont site"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
